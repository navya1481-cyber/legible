<title>Legible Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: #f7f9f8;
    color: #111820;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* Header */
  header {
    background: #fff;
    border-bottom: 1px solid #e4ede9;
    padding: 0 28px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .mark {
    width: 26px; height: 26px; border-radius: 6px;
    background: #1a3828;
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, serif; font-style: italic; font-weight: 700;
    font-size: 15px; color: #fff;
  }
  .logo-text { font-size: 14px; font-weight: 700; color: #111820; }
  .logo-sub { font-size: 12px; color: #8a9e98; margin-left: 6px; font-weight: 400; }
  .live-pill {
    display: flex; align-items: center; gap: 6px;
    background: #f0faf5; border: 1px solid #c5e8d8;
    border-radius: 100px; padding: 4px 12px;
    font-size: 12px; font-weight: 600; color: #1a7a50;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  /* Login */
  main { max-width: 960px; margin: 0 auto; padding: 28px 20px 60px; }
  #loginScreen { display: flex; align-items: center; justify-content: center; min-height: 60vh; }
  .login-card {
    background: #fff; border: 1px solid #e4ede9; border-radius: 16px;
    padding: 40px; max-width: 380px; width: 100%; text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
  }
  .login-card .mark-lg {
    width: 44px; height: 44px; border-radius: 10px; background: #1a3828;
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, serif; font-style: italic; font-weight: 700;
    font-size: 24px; color: #fff; margin: 0 auto 16px;
  }
  .login-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .login-card p { font-size: 13px; color: #6b7c76; margin-bottom: 24px; }
  .key-input {
    width: 100%; padding: 11px 14px;
    border: 1.5px solid #dde8e4; border-radius: 9px;
    font-size: 14px; font-family: 'SF Mono', 'Fira Code', monospace;
    background: #f7f9f8; color: #111820; letter-spacing: .05em;
  }
  .key-input:focus { outline: none; border-color: #1fa882; background: #fff; }
  .btn-login {
    margin-top: 12px; width: 100%;
    background: #1a3828; color: #fff; border: none;
    border-radius: 9px; padding: 11px;
    font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
    transition: background .15s;
  }
  .btn-login:hover { background: #266040; }
  .err { margin-top: 10px; font-size: 12px; color: #dc2626; }

  /* Dashboard */
  #dashboard { display: none; }

  /* Stat row */
  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat {
    background: #fff;
    border: 1px solid #e4ede9;
    border-radius: 12px;
    padding: 16px 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,.04);
  }
  .stat .n {
    font-size: 32px; font-family: Georgia, serif; font-weight: 700;
    color: #1a3828; line-height: 1; font-variant-numeric: tabular-nums;
  }
  .stat .lbl {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .06em; color: #8a9e98; margin-top: 5px;
  }
  .stat.errors .n { color: #dc2626; }

  /* Card */
  .card {
    background: #fff;
    border: 1px solid #e4ede9;
    border-radius: 14px;
    padding: 22px 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,.04);
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .card-title { font-size: 14px; font-weight: 700; color: #111820; }
  .refresh-btn {
    background: #f0faf5; border: 1px solid #c5e8d8; color: #1a7a50;
    border-radius: 7px; padding: 5px 14px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: background .15s;
  }
  .refresh-btn:hover { background: #ddf5eb; }

  /* Event feed */
  .feed { display: flex; flex-direction: column; gap: 6px; }
  .ev {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; border-radius: 9px;
    border: 1px solid #eef3f1; background: #fafcfb;
    transition: background .1s;
  }
  .ev:hover { background: #f3faf7; }
  .ev.fail { border-color: #fecaca; background: #fff5f5; }
  .badge {
    padding: 3px 9px; border-radius: 100px;
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; white-space: nowrap; flex-shrink: 0;
  }
  .badge-rights  { background: #dcfce7; color: #15803d; }
  .badge-letter  { background: #dbeafe; color: #1d4ed8; }
  .badge-analyze { background: #f3e8ff; color: #7e22ce; }
  .badge-fail    { background: #fee2e2; color: #dc2626; }
  .ev-main { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; color: #1a2820; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev-time { font-size: 11.5px; color: #aabdb6; flex-shrink: 0; }
  .empty {
    text-align: center; padding: 48px 20px;
    color: #aabdb6; font-size: 13px;
  }
  .empty .icon { font-size: 28px; margin-bottom: 10px; }
  .server-note { font-size: 12px; color: #aabdb6; margin-top: 14px; text-align: center; }
</style>

<header>
  <div class="logo">
    <div class="mark">L</div>
    <span class="logo-text">Legible Admin</span>
    <span class="logo-sub">Activity log</span>
  </div>
  <div class="live-pill"><div class="dot"></div>Live</div>
</header>

<main>

  <div id="loginScreen">
    <div class="login-card">
      <div class="mark-lg">L</div>
      <h2>Admin access</h2>
      <p>Enter your admin key to view activity.</p>
      <input class="key-input" type="password" id="keyInput" placeholder="Admin key" autocomplete="off">
      <button class="btn-login" onclick="login()">View dashboard</button>
      <div class="err" id="loginErr"></div>
    </div>
  </div>

  <div id="dashboard">

    <div class="stat-row">
      <div class="stat"><div class="n" id="sTotal">0</div><div class="lbl">Total events</div></div>
      <div class="stat"><div class="n" id="sRights">0</div><div class="lbl">Rights checks</div></div>
      <div class="stat"><div class="n" id="sLetters">0</div><div class="lbl">Letters generated</div></div>
      <div class="stat"><div class="n" id="sDocs">0</div><div class="lbl">Docs analyzed</div></div>
      <div class="stat errors"><div class="n" id="sFail">0</div><div class="lbl">Errors</div></div>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="card-title">Activity feed</div>
        <button class="refresh-btn" onclick="refresh()">Refresh</button>
      </div>
      <div class="feed" id="feed">
        <div class="empty"><div class="icon">📭</div>No events yet. Waiting for site activity.</div>
      </div>
      <p class="server-note" id="storageNote"></p>
    </div>

  </div>

</main>

<script>
  const BACKEND = 'https://legible-nn7i.onrender.com';
  let adminKey = sessionStorage.getItem('legible_admin_key') || '';
  let timer = null;

  document.getElementById('keyInput').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  if (adminKey) tryShow();

  function login() {
    const k = document.getElementById('keyInput').value.trim();
    if (!k) return;
    adminKey = k;
    tryShow();
  }

  async function tryShow() {
    try {
      const res = await fetch(`${BACKEND}/api/admin/events?key=${encodeURIComponent(adminKey)}`);
      if (res.status === 401) { document.getElementById('loginErr').textContent = 'Wrong admin key.'; return; }
      sessionStorage.setItem('legible_admin_key', adminKey);
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      render(await res.json());
      timer = setInterval(refresh, 10000);
    } catch(e) {
      document.getElementById('loginErr').textContent = 'Could not reach server.';
    }
  }

  async function refresh() {
    try {
      const res = await fetch(`${BACKEND}/api/admin/events?key=${encodeURIComponent(adminKey)}`);
      if (res.ok) render(await res.json());
    } catch(e) {}
  }

  function render({ events, total, persistent }) {
    document.getElementById('sTotal').textContent   = total || 0;
    document.getElementById('sRights').textContent  = events.filter(e => e.type === 'rights').length;
    document.getElementById('sLetters').textContent = events.filter(e => e.type === 'letter').length;
    document.getElementById('sDocs').textContent    = events.filter(e => e.type === 'analyze').length;
    document.getElementById('sFail').textContent    = events.filter(e => !e.success).length;

    const note = document.getElementById('storageNote');
    note.textContent = persistent
      ? 'Events stored in Upstash Redis — persists across all deploys and restarts.'
      : 'No Upstash connected — events reset on each deploy. Add UPSTASH_REDIS_REST_URL + TOKEN to Render env to fix.';

    const feed = document.getElementById('feed');
    if (!events.length) {
      feed.innerHTML = '<div class="empty"><div class="icon">📭</div>No events yet. Waiting for site activity.</div>';
      return;
    }

    feed.innerHTML = events.map(e => {
      const type   = e.type === 'rights' ? 'Rights check' : e.type === 'letter' ? 'Letter' : 'Doc analysis';
      const badgeCls = e.success
        ? (e.type === 'rights' ? 'badge-rights' : e.type === 'letter' ? 'badge-letter' : 'badge-analyze')
        : 'badge-fail';
      const label = e.success ? type : type + ' — failed';
      let detail = '';
      if (e.state) detail = [e.state, e.grade, e.disability].filter(Boolean).join(' · ');
      else if (e.chars) detail = `${Number(e.chars).toLocaleString()} chars`;
      const ago = timeAgo(e.t);
      return `
        <div class="ev ${e.success ? '' : 'fail'}">
          <span class="badge ${badgeCls}">${label}</span>
          <span class="ev-main">${detail || '—'}</span>
          <span class="ev-time">${ago}</span>
        </div>`;
    }).join('');
  }

  function timeAgo(iso) {
    const s = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (s < 60) return `${s}s ago`;
    if (s < 3600) return `${Math.floor(s/60)}m ago`;
    if (s < 86400) return `${Math.floor(s/3600)}h ago`;
    return `${Math.floor(s/86400)}d ago`;
  }
</script>
